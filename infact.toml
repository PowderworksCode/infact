[parsers]
search-paths = ["../entl/parser-packs"]

[catalogs]
search-paths = ["infact-packs/rust-itertools/api", "infact-packs/rust-std/api"]

[behaviors]
search-paths = ["infact-packs/rust-itertools/behaviors"]

[macro-behaviors]
search-paths = ["infact-packs/rust-strum/macro-behaviors"]

[duplication.exact]
min-tokens = 50
min-lines = 5

[duplication.near]
min-tokens = 80
min-lines = 8
normalize-identifiers = true
normalize-literals = true
max-changed-percent = 30
