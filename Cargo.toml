[workspace]
resolver = "3"
members = [
    "crates/infact-analysis",
    "crates/infact-behaviors",
    "crates/infact-catalog",
    "crates/infact-core",
    "crates/infact-duplication",
    "crates/infact-flow",
    "crates/infact-fact-pack",
    "crates/infact-fact-builder",
    "crates/infact-fact-registry",
    "crates/infact-c-normalize",
    "crates/infact-normalize",
    "crates/infact-python-normalize",
    "crates/infact-rust-lower",
    "crates/infact-rust-normalize",
    "crates/infact-ts-normalize",
    "crates/infact-ts-behaviors",
    "crates/infact-rust-effects",
    "crates/infact-zig-lifetimes",
    "crates/infact-zig-lower",
    "crates/infact-errors",
    "crates/infact-rust-behaviors",
    "crates/infact-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
repository = "https://github.com/zmaril/infact"

[workspace.dependencies]
ascent = { version = "0.8", default-features = false }
clap = { version = "4", features = ["derive"] }
entl = { path = "../entl/crates/entl" }
entl-tree-sitter = { path = "../entl/crates/entl-tree-sitter" }
heck = "0.5"
pathfinding = "4"
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "1.1"
tree-sitter = "0.26"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
let_underscore_must_use = "deny"

[profile.release]
lto = "thin"
