# The toolchain this repository is built and tested with.
#
# It was 1.96.1 because 1.97.1 ICEd on dbsp. dbsp is gone as of 2f97ada and the
# ICE with it, verified on 1.97.1 across all three repositories: infact checks
# clean with 139 tests and clippy -D warnings, entl 91 tests, straitjacket 68.
#
# Until now the version lived only in a rustup default on one machine, so a
# fresh checkout had no way to learn it. `components` is listed because clippy
# and rustfmt are not in the minimal profile, and their absence reports as
# "'cargo-clippy' is not installed for the toolchain", which reads like a lint
# failure rather than a missing component.
#
# crates/entl-rust-mir in the sibling repository still needs its own nightly
# and carries its own rust-toolchain.toml; this does not affect it.
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]
