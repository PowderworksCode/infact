name: CI

on:
  push:
    branches: [main]
  # paths-ignore keeps the heavy Cargo job off pull requests that only touch
  # prose, which is what `ci-scoped` asks for.
  pull_request:
    paths-ignore:
      - "**.md"
      - "notes/**"
      - "docs/**"
  # Periodic coverage, so bitrot between changes surfaces on its own. This
  # matters more here than elsewhere: the entl checkout below is unpinned, so a
  # sibling change can break this build without anything landing in infact.
  schedule:
    - cron: "17 4 * * 1"

# Least privilege. A job that needs to write grants it explicitly.
permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    # Generous: dbsp is slow to build from cold. The cache below makes the usual
    # run far shorter.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: infact
    steps:
      # Infact depends on entl through Cargo `path` dependencies, so both
      # repositories are checked out side by side and `../entl` resolves the
      # same way it does in a local powderworks checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: infact
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PowderworksCode/entl
          path: entl
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: infact
      # Every CI run contributes this build to the public compile-time census
      # at <https://cratebank.io/>. It builds what the steps below would have
      # built anyway, measured, so what is added here is mostly the measuring.
      #
      # `strict` because this is the build. A measurement that quietly did not
      # happen would mean nothing built the project either, and a green check
      # would be saying so about work that never ran.
      - uses: PowderworksCode/cratebank/action@v0.1.1
        with:
          args: --workspace
          org-id: powderworks
          strict: "true"

      # The toolchain comes from rust-toolchain.toml, which rustup installs on
      # first use, so no setup action decides the version.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
