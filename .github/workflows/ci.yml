name: CI

on:
  push:
    branches: [main]
  # paths-ignore keeps the heavy Cargo job off pull requests that only touch
  # prose, which is what `ci-scoped` asks for.
  pull_request:
    paths-ignore:
      - "**.md"
      - "notes/**"
      - "docs/**"
  # Periodic coverage, so bitrot between changes surfaces on its own. This
  # matters more here than elsewhere: the entl checkout below is unpinned, so a
  # sibling change can break this build without anything landing in infact.
  schedule:
    - cron: "17 4 * * 1"

# Least privilege. A job that needs to write grants it explicitly.
permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    # Generous: dbsp is slow to build from cold. The cache below makes the usual
    # run far shorter.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Infact depends on entl through Cargo `path` dependencies that name
      # `../entl`, a sibling of the repository root. actions/checkout will not
      # write outside the workspace, so entl arrives inside it and is moved into
      # place. Checking both out into subdirectories instead put every cargo
      # invocation one directory below the repository root, which left the paths
      # in this workflow bearing no relation to the paths in the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PowderworksCode/entl
          path: entl-checkout
      - name: entl, at the sibling path Cargo resolves
        run: |
          rm -rf ../entl
          mv entl-checkout ../entl
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            .
            tools/discard-golden
            tools/ts-scoreboard
      # The toolchain comes from rust-toolchain.toml, which rustup installs on
      # first use, so no setup action decides the version.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The measurement harnesses under tools/ are each their own workspace, so
      # nothing above compiles them; they depend on crates this workspace owns
      # and go stale the first time one of those changes shape. Built here
      # rather than in a job of their own, which would repeat the entl checkout
      # and rebuild the same dependency graph from cold.
      - run: cargo build
        working-directory: tools/discard-golden
      - run: cargo build
        working-directory: tools/ts-scoreboard
